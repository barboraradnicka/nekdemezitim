<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Objednávka | NěkdeMezitím</title>

  <style>
    body {
      margin: 0;
      background: #f7f0e6;
      color: #34231d;
      font-family: Georgia, serif;
    }

    .wrapper {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 60px 0 90px;
    }

    h1 {
      text-align: center;
      font-size: 52px;
      font-weight: normal;
      margin: 0 0 10px;
    }

    .intro {
      text-align: center;
      font-size: 20px;
      margin-bottom: 50px;
    }

    .product {
      background: #fffaf3;
      border: 1px solid #decabc;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 35px;
    }

    .product h2 {
      text-align: center;
      font-size: 34px;
      font-weight: normal;
      margin-top: 0;
    }

    .back {
      text-align: center;
      margin-top: 45px;
    }

    .back a {
      color: #8c5035;
    }
  </style>
</head>

<body>

  <main class="wrapper">

    <h1>NěkdeMezitím</h1>

    <p class="intro">
      Vyber si variantu a dokonči objednávku.
    </p>

    <section class="product">
      <h2>1 měsíc — 249 Kč</h2>

      <div data-SimpleShopForm="Aa4YL"></div>
    </section>


    <section class="product">
      <h2>3 měsíce — 747 Kč</h2>

      <div data-SimpleShopForm="oPR24"></div>
    </section>


    <section class="product">
      <h2>6 měsíců — 1 404 Kč</h2>

      <div data-SimpleShopForm="0Ma5P"></div>
    </section>


    <section class="product">
      <h2>12 měsíců — 2 659 Kč</h2>

      <div data-SimpleShopForm="9XlzE"></div>
    </section>


    <p class="back">
      <a href="../">← Zpět na NěkdeMezitím</a>
    </p>

  </main>


  <script>
    (function(i,s,o,g,r,a,m){
      i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)
      };
      i[r].l=1*new Date();
      a=s.createElement(o);
      m=s.getElementsByTagName(o)[0];
      a.async=1;
      a.src=g;
      m.parentNode.insertBefore(a,m)
    })(
      window,
      document,
      "script",
      "https://form.simpleshop.cz/prj/js/SimpleShopService.js",
      "sss"
    );

    sss("createForm", "Aa4YL");
    sss("createForm", "oPR24");
    sss("createForm", "0Ma5P");
    sss("createForm", "9XlzE");
  </script>

</body>
</html>
